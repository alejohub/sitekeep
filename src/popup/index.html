<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteKeep</title><link rel="stylesheet" href="../shared.css"></head><body class="popup"><header><div class="popup-brand"><div class="brand">Site<span>Keep</span></div><span class="muted extension-meta popup-version" id="version"></span></div></header><span id="status" class="status">Cargando…</span><h1 id="host">Consultando sitio…</h1><div class="stats"><div><div id="count" class="metric">—</div><span class="muted">Cookies detectadas</span></div><div><div id="origins" class="metric">—</div><span class="muted">Orígenes conocidos</span></div></div><p class="muted">Los tamaños de almacenamiento no están disponibles por sitio.</p><button id="protect" class="primary" disabled>Proteger sitio</button><button id="delete" class="danger" disabled>Borrar datos de este sitio</button><div class="card"><label for="interval" class="muted">LIMPIEZA AUTOMÁTICA</label><select id="interval" aria-label="Frecuencia de limpieza"><option value="0">Desactivada</option><option value="1440">Cada 24 horas</option><option value="4320">Cada 3 días</option><option value="10080">Cada 7 días</option><option value="lastWindowClosed">Al cerrar todas las ventanas</option></select><p id="next" class="schedule-meta">—</p><span class="muted">Los sitios protegidos se conservan.</span></div><div class="actions popup-footer-actions"><button id="dashboard" class="dashboard-entry">Abrir dashboard <span aria-hidden="true">↗</span></button><button id="clean-all" class="danger">Borrar todo</button></div><p id="notice" role="status" class="notice" aria-live="polite"></p><dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="actions"></div></dialog><script type="module" src="popup.js"></script></body></html>
